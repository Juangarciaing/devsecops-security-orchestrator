services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      application:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      application:

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Module 13a — off by default (empty ⇒ zero exporter, zero behavior
      # change). Opt in by setting this in `.env` to the `jaeger` service's
      # OTLP-gRPC address (`http://jaeger:4317`).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      PROMETHEUS_MULTIPROC_DIR: /prometheus
    # --host 0.0.0.0 (not the fixed 172.30.0.10 observability-network address
    # below): uvicorn must accept connections on EVERY network interface the
    # container has, not just the one nginx/Prometheus's static-IP configs
    # target — a caller reaching this container only via the `application`
    # network (e.g. `frontend`) gets refused otherwise, since nothing would
    # be listening on that interface.
    command: ["uvicorn", "orchestrator.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - metrics-data:/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      metrics-init:
        condition: service_completed_successfully
    networks:
      application:
      observability:
        ipv4_address: 172.30.0.10
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
            "import urllib.request; urllib.request.urlopen('http://172.30.0.10:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Module 13a — same off-by-default opt-in as `backend` above; the
      # worker's TracerProvider/exporter is initialized per forked child
      # process via a `worker_process_init` handler (fork-safety, D2).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      PROMETHEUS_MULTIPROC_DIR: /prometheus
    # github-checks-publisher PR7 — `github_checks` added alongside `scan`:
    # Beat (the `scheduler` service below) only ENQUEUES
    # `sweep_github_check_publications_task` onto this queue every 60s
    # (`celery_app.py`'s `beat_schedule`); this worker is what actually
    # CONSUMES it. Without this, the queue is declared but nothing ever
    # drains it — the sweep silently piles up in Redis.
    command: ["celery", "-A", "orchestrator.workers.celery_app", "worker", "-Q", "scan,github_checks", "-l", "info"]
    # Module 6: the worker orchestrates SIBLING scanner/init containers via
    # the `docker` Python SDK — it is the ONLY service that gets the Docker
    # socket (`backend`, the API server, has no business launching
    # containers). Holding this socket is root-equivalent to the HOST
    # (design's accepted residual risk R1: durable fix = Module 13's
    # k8s Jobs + gVisor/Kata, no socket). R1 is scoped to socket access
    # itself, NOT to the worker's own process UID — running the Celery
    # process as root would needlessly widen the blast radius of any
    # UNRELATED vulnerability in worker/dependency code. The image's
    # non-root `appuser` (uid 1000, set via `USER appuser` in
    # `docker/backend.Dockerfile`) is kept as-is; `group_add` grants that
    # user supplementary access to the host's docker.sock group instead.
    # `DOCKER_GID` is host-specific (varies by distro/CI/Docker Desktop vs
    # Engine) — set it in `.env` to your host's actual GID, found via:
    #   stat -c '%g' /var/run/docker.sock   (Linux)
    #   ls -la /var/run/docker.sock         (macOS, read the group column)
    # 999 is a common default on many Debian/Ubuntu hosts but is NOT
    # guaranteed — always verify against your own host.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - metrics-data:/prometheus
      # github-checks-publisher PR7 — read-only bind mount for the GitHub
      # App private key PEM. WORKER-ONLY: point `GITHUB_APP_PRIVATE_KEY_FILE`
      # (in `.env`) at the in-container path, e.g. `/secrets/github-app.pem`.
      # `./secrets/` is gitignored and empty by default — harmless while
      # `github_checks_delivery_enabled` stays `false`, since the sweep task
      # returns before ever reading this path (see README "GitHub Checks
      # publishing"). The `scheduler` service below never gets this mount.
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      metrics-init:
        condition: service_completed_successfully
    networks:
      application:

  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    # github-checks-publisher PR7 (design: "Deployment topology") — explicit
    # `environment:` entries here, NOT `env_file: .env` like `worker`/
    # `backend` above. That is load-bearing: it guarantees
    # `GITHUB_APP_ID`/`GITHUB_APP_PRIVATE_KEY_FILE` are NEVER present in this
    # container's resolved environment, even though `.env` sets them for
    # `worker`. Beat only enqueues a task name onto a queue every 60s — it
    # never calls GitHub's API or reads App credentials itself (design: "PEM
    # is worker-only, never Beat").
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    # `-s /tmp/celerybeat-schedule`: beat's default schedule path is the CWD
    # (`/app`), which is root-owned in the image (only `.venv`/`src` are
    # `--chown`'d to `appuser` — see docker/backend.Dockerfile). `/tmp` is
    # writable by any UID, so this avoids widening `appuser`'s permissions
    # on `/app` just to let beat persist its schedule state.
    command: ["celery", "-A", "orchestrator.workers.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      application:

  metrics-init:
    image: alpine:3.22
    command: ["sh", "-c", "test -f /prometheus/.initialized || (rm -rf /prometheus/* && chmod 0777 /prometheus && touch /prometheus/.initialized)"]
    volumes:
      - metrics-data:/prometheus
    network_mode: none

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    volumes:
      - ./docker/metrics-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      application:
      observability:

  worker-metrics:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    profiles: ["observability"]
    command: ["python", "-m", "orchestrator.infrastructure.observability.worker_metrics_exporter"]
    environment:
      PROMETHEUS_MULTIPROC_DIR: /prometheus
    volumes:
      - metrics-data:/prometheus
    pid: service:worker
    depends_on:
      worker:
        condition: service_started
      metrics-init:
        condition: service_completed_successfully
    networks:
      observability:

  prometheus:
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/tmp/prometheus"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
      worker-metrics:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      observability:

  jaeger:
    # Module 13a — self-hosted OTLP trace collector + UI. Always present in
    # the stack (harmless when unused); the `backend`/`worker` services'
    # OTEL_EXPORTER_OTLP_ENDPOINT default is empty, so a fresh `docker
    # compose up` with no `.env` opt-in exhibits zero tracing behavior even
    # though this service is running. Digest confirmed at apply time via
    # `docker buildx imagetools inspect jaegertracing/all-in-one:1.62.0`.
    image: "jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f"
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
    networks:
      observability:

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5173",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      application:

volumes:
  pgdata:
  redisdata:
  metrics-data:

networks:
  application:
  observability:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
