# Namespace-scoped least-privilege RBAC (Module 13c PR7): exactly the
# Jobs/Pods/PVCs/logs verbs `KubernetesJobRunnerPort`'s methods use
# (get_pvc/create_pvc/get_job/create_job/wait_for_job/get_job_logs/
# delete_job/delete_pvc) — never a wildcard verb, resource, or apiGroup, and
# never a ClusterRole/ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scan-job-runner
  labels:
    app.kubernetes.io/name: security-orchestrator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkout-scan-job-runner
  labels:
    app.kubernetes.io/name: security-orchestrator
    component: checkout
subjects:
  - kind: ServiceAccount
    name: checkout
roleRef:
  kind: Role
  name: scan-job-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scanner-scan-job-runner
  labels:
    app.kubernetes.io/name: security-orchestrator
    component: scanner
subjects:
  - kind: ServiceAccount
    name: scanner
roleRef:
  kind: Role
  name: scan-job-runner
  apiGroup: rbac.authorization.k8s.io
