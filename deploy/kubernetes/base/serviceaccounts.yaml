# Dedicated ServiceAccounts for the checkout and scanner Job Pods (Module
# 13c PR7) — never the namespace's `default` ServiceAccount, so neither
# workload inherits broader implicit permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout
  labels:
    app.kubernetes.io/name: security-orchestrator
    component: checkout
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
  labels:
    app.kubernetes.io/name: security-orchestrator
    component: scanner
automountServiceAccountToken: false
